<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>TV Shader</title>
  <link href='https://fonts.googleapis.com/css?family=Oswald:400,700' rel='stylesheet' type='text/css'>
  <style>
    body {
      margin: 0;
      overflow: hidden;

      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .close-btn {
      position: fixed;
      z-index: 1000;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 2px solid white;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    .close-btn:hover {
      background: white;
    }

    .close-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .icon {
      width: 1.5em;
      height: 1.5em;
      vertical-align: -0.125em;
      fill: white;
      transition: fill 0.2s ease;
    }

    .close-btn:hover .icon {
      fill: #333;
    }

    .menu {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100vh;
      background: linear-gradient(to right, rgba(24, 26, 25, 0), rgba(24, 26, 25, 1));
      padding: 10px 20px;
      overflow-y: auto;
      z-index: 1000;
      box-sizing: border-box;

      color: white;
    }

    .menu h2 {
      font-size: 1.5rem;
    }

    .info-text {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }

    .info-text p {
      color: white;
      font-size: 1.2rem;
      margin: 0;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
  </style>

  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <div class="menu">
    <h2>Shader Options</h2>

    <div class="menu-options">
      <div id="dial-container">
        <div id="dial-value">0</div>
        <div id="info">DRAG DIAL</div>
        <svg id="svg-node" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284.1 218.7">
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="coloredBlur" />
              <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <g id="outline">
            <path id="arc-bg" fill="none" stroke="#444444" stroke-width="6" stroke-linecap="round"
              d="M52.1,100.2c0-49.7,40.3-90,90-90s90,40.3,90,90" />
            <path id="arc-fill" fill="none" stroke="#FF4081" stroke-width="6" stroke-linecap="round"
              d="M52.1,100.2c0-49.7,40.3-90,90-90s90,40.3,90,90" filter="url(#glow)" />
            <circle fill="none" stroke="#444444" stroke-width="4" cx="142.1" cy="100.2" r="64" />
          </g>
          <g id="drag-handle">
            <circle fill="rgba(255,255,255,0.01)" stroke="none" cx="142.1" cy="100.2" r="50" style="cursor: grab;" />
          </g>
          <g id="dial-line">
            <line fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-miterlimit="10" x1="142.1"
              y1="100.2" x2="142.1" y2="36.2" />
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="info-text">
    <p>Click one of the TV buttons to alter the shader.</p>
  </div>

  <button class="animated-button">
    <svg aria-hidden="true" viewBox="0 0 640 640" class="arr-2" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z" />
    </svg>

    <span class="text">Close (esc)</span>
    <span class="circle"></span>

    <svg aria-hidden="true" viewBox="0 0 640 640" class="arr-1" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z">
      </path>
    </svg>
  </button>

  <script type="module" src="src/main.js"></script>
</body>

</html>
